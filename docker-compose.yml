services:
  db:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: market, POSTGRES_USER: market, POSTGRES_PASSWORD: market-dev-only}
    volumes: [market_postgres:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U market -d market"], interval: 5s, timeout: 5s, retries: 12}
  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --reload"
    env_file: .env
    volumes: [./backend:/app, market_media:/app/media]
    ports: ["8002:8000"]
    depends_on: {db: {condition: service_healthy}}
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready/')"], interval: 5s, timeout: 3s, retries: 20}
  worker:
    build: ./backend
    command: python manage.py process_jobs
    env_file: .env
    volumes: [./backend:/app, market_media:/app/media]
    depends_on: {backend: {condition: service_healthy}}
    extra_hosts: ["host.docker.internal:host-gateway"]
  frontend:
    build: ./frontend
    environment: {API_INTERNAL_URL: "http://backend:8000", NEXT_PUBLIC_API_URL: "http://localhost:8002"}
    ports: ["3001:3000"]
    depends_on: {backend: {condition: service_healthy}}
volumes: {market_postgres: {}, market_media: {}}
